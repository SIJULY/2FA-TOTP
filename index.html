<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2FA Authenticator - Cyber</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    [v-cloak] { display: none; }

    :root {
      --bg-dark: #0a0a0f;
      --bg-panel: rgba(16, 20, 31, 0.85);
      --cyan: #00f3ff;
      --cyan-dim: rgba(0, 243, 255, 0.2);
      --blue: #0b5bf8;
      --blue-glow: rgba(11, 91, 248, 0.5);
      --text-main: #e0f2fe;
      --text-muted: #7dd3fc;
      --warning: #ff003c;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(var(--cyan-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--cyan-dim) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 扫描线效果 */
    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.2) 50%,
        rgba(0, 0, 0, 0.2)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 999;
      opacity: 0.3;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
      z-index: 10;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--cyan-dim);
      padding: 40px 32px;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    }

    /* 边角装饰 */
    .auth-card::before, .auth-card::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--cyan);
      pointer-events: none;
    }
    .auth-card::before {
      top: -1px; left: -1px;
      border-right: none; border-bottom: none;
    }
    .auth-card::after {
      top: -1px; right: -1px;
      border-left: none; border-bottom: none;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .header-icon {
      width: 56px;
      height: 56px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim);
      transform: rotate(45deg);
    }
    .header-icon svg {
      transform: rotate(-45deg);
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--cyan);
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--cyan-dim);
    }

    .input-group {
      margin-bottom: 24px;
      position: relative;
    }

    .input-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--cyan-dim);
      color: var(--cyan);
      padding: 12px 16px;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      -webkit-user-select: text;
      user-select: text;
      font-family: 'Share Tech Mono', monospace;
    }

    .input-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .row .input-group {
      flex: 1;
    }

    .token-display {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--cyan);
      padding: 24px 10px;
      text-align: center;
      margin: 32px 0;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
    }

    #token {
      font-family: 'Share Tech Mono', monospace;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 8px;
      margin: 0;
      color: #fff;
      text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--blue);
      pointer-events: none;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      transition: width 1s linear;
    }

    .progress-bar-fill.warning {
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
    }
    .text-warning {
      color: var(--warning) !important;
      text-shadow: 0 0 8px var(--warning);
    }

    .copy-btn {
      width: 100%;
      background: transparent;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
      margin-top: 32px;
      position: relative;
      overflow: hidden;
    }

    .copy-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .copy-btn:hover::before {
      left: 100%;
    }

    .copy-btn:hover {
      background: rgba(0, 243, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }

    .toast-container {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 243, 255, 0.1);
      backdrop-filter: blur(5px);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .toast-container.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon-check {
      margin-right: 10px;
      font-size: 18px;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 24px;
      font-size: 14px;
      color: var(--text-muted);
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 5px var(--cyan-dim);
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <script src="js/vue-2.4.0.min.js"></script>
  <script src="js/otpauth-3.1.3.min.js"></script>
  <script src="js/clipboard-2.0.6.min.js"></script>

  <div id="app" class="main-wrapper" v-cloak>

    <div class="toast-container" :class="{ show: showToast }">
      <span class="toast-icon-check">✓</span> AUTH_CODE_COPIED
    </div>

    <div class="auth-card">
      <div class="header">
        <div class="header-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="header-title">SYS_AUTH</h1>
      </div>

      <div class="input-group">
        <label class="input-label">SECRET_KEY // 秘钥</label>
        <input class="input-field" type="text" v-model="secret_key" placeholder="INPUT_SECRET_KEY">
      </div>

      <div class="row">
        <div class="input-group">
          <label class="input-label">DIGITS // 位数</label>
          <input class="input-field" type="number" v-model="digits">
        </div>
        <div class="input-group">
          <label class="input-label">PERIOD // 周期(s)</label>
          <input class="input-field" type="number" v-model="period">
        </div>
      </div>

      <div class="token-display">
        <p id="token">{{ token }}</p>
      </div>

      <div>
        <div class="timer-row">
          <span>REFRESH_IN</span>
          <span :class="{ 'text-warning': updatingIn <= 5 }">00:{{ updatingIn < 10 ? '0' + updatingIn : updatingIn }}</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" :class="{ warning: updatingIn <= 5 }" :style="{ width: (updatingIn / period * 100) + '%' }"></div>
        </div>
      </div>

      <button id="clipboard-button" class="copy-btn" :data-clipboard-text="token">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        COPY_TOKEN
      </button>

    </div>
  </div>

  <footer class="footer">
    SYSTEM_BUILT_BY <a href="https://sijuly.nyc.mn" target="_blank">小龙女她爸</a>
  </footer>

  <script src="js/app.js?v=4.0"></script>
</body>
</html>
