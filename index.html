<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2FA Authenticator - Cyber</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    [v-cloak] { display: none; }

    :root {
      --bg-dark: #050508;
      --bg-panel: rgba(10, 14, 23, 0.7);
      --cyan: #00f3ff;
      --cyan-dim: rgba(0, 243, 255, 0.2);
      --blue: #0b5bf8;
      --text-main: #e0f2fe;
      --text-muted: #7dd3fc;
      --warning: #ff003c;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(var(--cyan-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--cyan-dim) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* 扫描线效果 */
    body::before {
      content: "";
      position: fixed;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    .dashboard-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1400px;
      padding: 40px;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .dashboard-wrapper {
        padding: 20px;
      }
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--cyan-dim);
      padding-bottom: 20px;
      position: relative;
    }

    .top-nav::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 30%;
      height: 1px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim);
      transform: rotate(45deg);
    }
    .header-icon svg {
      transform: rotate(-45deg);
    }

    .header-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--cyan);
      margin: 0;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--cyan-dim);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      border: 1px solid var(--cyan-dim);
      padding: 8px 16px;
      background: rgba(0, 243, 255, 0.05);
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 600px) {
      .top-nav { flex-direction: column; gap: 20px; align-items: flex-start; }
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      flex: 1;
    }

    @media (max-width: 960px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--cyan-dim);
      padding: 40px;
      position: relative;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.02);
    }

    .panel::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px;
      width: 20px; height: 20px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }
    .panel::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 20px; height: 20px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .panel-header {
      margin-bottom: 30px;
      border-bottom: 1px dashed var(--cyan-dim);
      padding-bottom: 15px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 20px;
      color: var(--text-muted);
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 3px;
    }

    .input-group {
      margin-bottom: 30px;
      position: relative;
    }

    .label-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .label-icon {
      width: 18px;
      height: 18px;
      color: var(--cyan);
      opacity: 0.8;
    }

    .label-en {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1.5px;
    }

    .label-zh {
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.7;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--cyan-dim);
      color: var(--cyan);
      padding: 16px 20px;
      font-size: 18px;
      outline: none;
      transition: all 0.3s ease;
      -webkit-user-select: text;
      user-select: text;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 1px;
    }

    .input-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
      background: rgba(0, 20, 30, 0.8);
    }

    .row {
      display: flex;
      gap: 20px;
    }

    .row .input-group {
      flex: 1;
    }

    .token-display {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--cyan-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      margin-bottom: 30px;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0, 243, 255, 0.05);
      min-height: 180px;
    }

    .token-display::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 1px;
      background: rgba(0, 243, 255, 0.1);
    }

    #token {
      font-family: 'Share Tech Mono', monospace;
      font-size: 80px;
      font-weight: 700;
      letter-spacing: 16px;
      margin: 0;
      margin-right: -16px; /* offset letter-spacing */
      color: #fff;
      text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--blue);
      pointer-events: none;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 1200px) {
      #token { font-size: 60px; letter-spacing: 12px; margin-right: -12px;}
    }
    @media (max-width: 480px) {
      #token { font-size: 44px; letter-spacing: 8px; margin-right: -8px;}
    }

    .timer-section {
      width: 100%;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--cyan);
      box-shadow: 0 0 15px var(--cyan);
      transition: width 1s linear;
    }

    .progress-bar-fill.warning {
      background: var(--warning);
      box-shadow: 0 0 15px var(--warning);
    }
    .text-warning {
      color: var(--warning) !important;
      text-shadow: 0 0 10px var(--warning);
    }

    .copy-btn {
      width: 100%;
      background: transparent;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 20px;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      -webkit-tap-highlight-color: transparent;
      margin-top: 30px;
      position: relative;
      overflow: hidden;
    }

    .copy-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .copy-btn:hover::before {
      left: 100%;
    }

    .copy-btn:hover {
      background: rgba(0, 243, 255, 0.1);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
      border-color: #fff;
      color: #fff;
    }

    .toast-container {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 30, 40, 0.9);
      backdrop-filter: blur(10px);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .toast-container.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon-check {
      margin-right: 12px;
      font-size: 22px;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: var(--text-muted);
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 5px var(--cyan-dim);
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <script src="js/vue-2.4.0.min.js"></script>
  <script src="js/otpauth-3.1.3.min.js"></script>
  <script src="js/clipboard-2.0.6.min.js"></script>

  <div id="app" class="dashboard-wrapper" v-cloak>

    <div class="toast-container" :class="{ show: showToast }">
      <span class="toast-icon-check">✓</span> AUTH_CODE_COPIED
    </div>

    <header class="top-nav">
      <div class="logo-area">
        <div class="header-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="header-title">SYS_AUTH_TERMINAL</h1>
      </div>
      <div class="system-status">
        <span class="status-dot"></span>
        <span>SYSTEM_ONLINE</span>
      </div>
    </header>

    <main class="dashboard-grid">
      
      <!-- 左侧：参数配置面板 -->
      <section class="panel config-panel">
        <div class="panel-header">
          <h2>[ PARAMETERS ]</h2>
        </div>
        
        <div class="input-group">
          <div class="label-wrapper">
            <!-- 秘钥图标 -->
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
            </svg>
            <span class="label-en">SECRET_KEY</span>
            <span class="label-zh">秘钥</span>
          </div>
          <input class="input-field" type="text" v-model="secret_key" placeholder="INPUT_SECRET_KEY">
        </div>

        <div class="row">
          <div class="input-group">
            <div class="label-wrapper">
              <!-- 位数图标 -->
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <path d="M8 12h8"></path>
                <path d="M12 8v8"></path>
              </svg>
              <span class="label-en">DIGITS</span>
              <span class="label-zh">位数</span>
            </div>
            <input class="input-field" type="number" v-model="digits">
          </div>
          
          <div class="input-group">
            <div class="label-wrapper">
              <!-- 周期图标 -->
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span class="label-en">PERIOD</span>
              <span class="label-zh">周期</span>
            </div>
            <input class="input-field" type="number" v-model="period">
          </div>
        </div>
      </section>

      <!-- 右侧：令牌输出面板 -->
      <section class="panel output-panel">
        <div class="panel-header">
          <h2>[ ACTIVE_TOKEN ]</h2>
        </div>

        <div class="token-display">
          <p id="token">{{ token }}</p>
        </div>

        <div class="timer-section">
          <div class="timer-row">
            <span>REFRESH_IN</span>
            <span :class="{ 'text-warning': updatingIn <= 5 }">00:{{ updatingIn < 10 ? '0' + updatingIn : updatingIn }}</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" :class="{ warning: updatingIn <= 5 }" :style="{ width: (updatingIn / period * 100) + '%' }"></div>
          </div>
        </div>

        <button id="clipboard-button" class="copy-btn" :data-clipboard-text="token">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          COPY_TOKEN
        </button>
      </section>

    </main>
  </div>

  <footer class="footer">
    SYSTEM_BUILT_BY <a href="https://sijuly.nyc.mn" target="_blank">小龙女她爸</a>
  </footer>

  <script src="js/app.js?v=4.0"></script>
</body>
</html>
